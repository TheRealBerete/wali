<!DOCTYPE html>

<html class="dark" lang="fr"><head>

<style>
        /* Custom hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .category-input:checked + label {
            border-color: #fce300;
            background-color: rgba(252, 227, 0, 0.1);
        }
        .category-input:checked + label span.material-symbols-outlined {
            color: #fce300;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Header (TopAppBar equivalent for focused flow, suppressed main nav as per rules) -->
<header class="w-full top-0 sticky bg-background dark:bg-surface-dim flat no shadows flex justify-between items-center px-margin-mobile py-4 z-50">
<button aria-label="Fermer" class="text-on-surface-variant hover:opacity-80 transition-opacity duration-200 p-2 -ml-2 rounded-full active:bg-surface-container-high" type="button">
<span class="material-symbols-outlined" style="font-size: 28px;">close</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary-fixed dark:text-primary-fixed-dim">Wali</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pb-[100px] max-w-container-max mx-auto w-full pt-8">
<!-- Numeric Input Area -->
<section class="flex flex-col items-center justify-center py-10 mb-8 relative">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-4">Montant de la dépense</span>
<div class="flex items-end justify-center w-full relative">
<!-- Main Input -->
<input class="bg-transparent border-none outline-none font-display-lg text-display-lg text-center text-primary-fixed w-full placeholder-surface-variant focus:ring-0 px-0" id="amount-input" inputmode="numeric" placeholder="0" type="text" value="45 000"/>
</div>
<div class="mt-2 text-on-surface-variant font-title-md text-title-md">
                GNF
            </div>
<!-- Minimalist underline indicating input focus/active state -->
<div class="w-24 h-[2px] bg-primary-fixed mt-8 opacity-50"></div>
</section>
<!-- Category Grid -->
<section class="flex-grow flex flex-col">
<h2 class="font-title-md text-title-md text-on-background mb-6 text-center">Catégorie</h2>
<div class="grid grid-cols-2 gap-4 md:grid-cols-4 md:gap-6">
<!-- Food -->
<div class="relative">
<input checked="" class="sr-only category-input" id="cat-food" name="category" type="radio"/>
<label class="flex flex-col items-center justify-center p-6 rounded-xl border border-surface-container-high bg-surface-container-low cursor-pointer transition-all duration-200 hover:border-primary-fixed/50 group h-full" for="cat-food">
<span class="material-symbols-outlined mb-3 text-on-surface-variant group-hover:text-on-background transition-colors" style="font-size: 32px;">restaurant</span>
<span class="font-body-sm text-body-sm text-on-background">Alimentation</span>
</label>
</div>
<!-- Transport -->
<div class="relative">
<input class="sr-only category-input" id="cat-transport" name="category" type="radio"/>
<label class="flex flex-col items-center justify-center p-6 rounded-xl border border-surface-container-high bg-surface-container-low cursor-pointer transition-all duration-200 hover:border-primary-fixed/50 group h-full" for="cat-transport">
<span class="material-symbols-outlined mb-3 text-on-surface-variant group-hover:text-on-background transition-colors" style="font-size: 32px;">directions_car</span>
<span class="font-body-sm text-body-sm text-on-background">Transport</span>
</label>
</div>
<!-- Rent -->
<div class="relative">
<input class="sr-only category-input" id="cat-rent" name="category" type="radio"/>
<label class="flex flex-col items-center justify-center p-6 rounded-xl border border-surface-container-high bg-surface-container-low cursor-pointer transition-all duration-200 hover:border-primary-fixed/50 group h-full" for="cat-rent">
<span class="material-symbols-outlined mb-3 text-on-surface-variant group-hover:text-on-background transition-colors" style="font-size: 32px;">home</span>
<span class="font-body-sm text-body-sm text-on-background">Logement</span>
</label>
</div>
<!-- Leisure -->
<div class="relative">
<input class="sr-only category-input" id="cat-leisure" name="category" type="radio"/>
<label class="flex flex-col items-center justify-center p-6 rounded-xl border border-surface-container-high bg-surface-container-low cursor-pointer transition-all duration-200 hover:border-primary-fixed/50 group h-full" for="cat-leisure">
<span class="material-symbols-outlined mb-3 text-on-surface-variant group-hover:text-on-background transition-colors" style="font-size: 32px;">sports_esports</span>
<span class="font-body-sm text-body-sm text-on-background">Loisirs</span>
</label>
</div>
</div>
<!-- Optional Note Field (Minimal) -->
<div class="mt-8 mb-4 border-b border-surface-container-high focus-within:border-primary-fixed transition-colors">
<input class="w-full bg-transparent border-none outline-none text-on-background placeholder-surface-variant font-body-sm text-body-sm py-3 px-1 focus:ring-0" placeholder="Ajouter une note (optionnel)" type="text"/>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background to-transparent z-40 pb-safe">
<div class="max-w-container-max mx-auto">
<button class="w-full bg-primary-fixed text-on-primary-fixed font-headline-lg-mobile text-headline-lg-mobile h-[64px] rounded-full flex items-center justify-center active:scale-95 transition-transform shadow-[0_0_15px_rgba(253,228,3,0.2)]">
                Ajouter
            </button>
</div>
</div>
<!-- Script for basic interaction formatting -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const amountInput = document.getElementById('amount-input');
            
            // Basic number formatting (spaces for thousands)
            amountInput.addEventListener('input', function(e) {
                // Remove non-digits
                let value = this.value.replace(/\D/g, '');
                
                // Format with spaces
                if (value) {
                    value = parseInt(value, 10).toLocaleString('fr-FR').replace(/\s/g, ' ');
                }
                
                this.value = value;
            });
            
            // Auto-focus input on load for immediate entry
            setTimeout(() => {
                amountInput.focus();
                // Move cursor to end
                amountInput.setSelectionRange(amountInput.value.length, amountInput.value.length);
            }, 300);
        });
    </script>
</body></html>
