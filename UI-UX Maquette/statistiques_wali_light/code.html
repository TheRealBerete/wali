<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wali - Statistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#fde403",
                        "primary-fixed-dim": "#dec800",
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"],
                        "title-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #FFFFFF; color: #000000; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* Custom minimal pie chart using conic-gradient */
        .chart-container {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: conic-gradient(
                theme('colors.primary-fixed') 0% 45%, 
                #f3f4f6 45% 75%, 
                #d1d5db 75% 100%
            );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-inner {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative bg-white text-black">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-white">
<div class="flex justify-between items-center px-margin-mobile py-4 bg-white">
<button class="text-gray-600 hover:opacity-80 transition-opacity duration-200 p-2 -ml-2 rounded-full active:bg-gray-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_balance_wallet</span>
</button>
<h1 class="font-display-lg text-display-lg font-extrabold text-primary-fixed tracking-tighter">Wali</h1>
<button class="text-gray-600 hover:opacity-80 transition-opacity duration-200 p-2 -mr-2 rounded-full active:bg-gray-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-6 pb-24 flex flex-col gap-8 max-w-container-max mx-auto w-full md:px-margin-desktop">
<!-- Header & Period Selector -->
<section class="flex flex-col gap-6">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-black md:font-headline-lg md:text-headline-lg">Statistics</h2>
<p class="font-body-sm text-body-sm text-gray-600 mt-1">Analyze your spending</p>
</div>
<div class="flex bg-gray-100 p-1 rounded-xl">
<button class="flex-1 py-2 px-4 rounded-lg font-label-caps text-label-caps text-gray-600 hover:text-black transition-colors">Week</button>
<button class="flex-1 py-2 px-4 rounded-lg bg-black text-white font-label-caps text-label-caps border border-gray-800 shadow-sm transition-colors">Month</button>
<button class="flex-1 py-2 px-4 rounded-lg font-label-caps text-label-caps text-gray-600 hover:text-black transition-colors">Year</button>
</div>
</section>
<!-- Chart Section -->
<section class="flex flex-col items-center justify-center bg-gray-50 rounded-[24px] p-8 border border-gray-200">
<div class="chart-container mb-8">
<div class="chart-inner">
<span class="font-body-sm text-body-sm text-gray-600">Total Spent</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-black mt-1">4,250K</span>
<span class="font-label-caps text-label-caps text-primary-fixed mt-1">GNF</span>
</div>
</div>
<!-- Legend -->
<div class="flex flex-wrap justify-center gap-4 w-full max-w-sm">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary-fixed"></div>
<span class="font-body-sm text-body-sm text-black">Housing</span>
<span class="font-label-caps text-label-caps text-gray-600 ml-auto">45%</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-gray-100 border border-gray-300"></div>
<span class="font-body-sm text-body-sm text-black">Food</span>
<span class="font-label-caps text-label-caps text-gray-600 ml-auto">30%</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-gray-300"></div>
<span class="font-body-sm text-body-sm text-black">Entertainment</span>
<span class="font-label-caps text-label-caps text-gray-600 ml-auto">25%</span>
</div>
</div>
</section>
<!-- Top 3 Dépenses -->
<section class="flex flex-col gap-4">
<h3 class="font-title-md text-title-md text-black">Top 3 Dépenses</h3>
<div class="flex flex-col gap-3">
<!-- Item 1 -->
<div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-black">
<span class="material-symbols-outlined">home</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-black font-semibold">Loyer</p>
<p class="font-body-sm text-body-sm text-gray-600">Housing</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-black font-semibold">1,900K</p>
<p class="font-label-caps text-label-caps text-gray-600">GNF</p>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-black">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-black font-semibold">Supermarché</p>
<p class="font-body-sm text-body-sm text-gray-600">Food</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-black font-semibold">850K</p>
<p class="font-label-caps text-label-caps text-gray-600">GNF</p>
</div>
</div>
<!-- Item 3 -->
<div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-gray-200 flex items-center justify-center text-black">
<span class="material-symbols-outlined">directions_car</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-black font-semibold">Carburant</p>
<p class="font-body-sm text-body-sm text-gray-600">Transport</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-black font-semibold">420K</p>
<p class="font-label-caps text-label-caps text-gray-600">GNF</p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 md:hidden bg-white/90 backdrop-blur-md border-t border-gray-200">
<div class="flex justify-around items-center h-16 px-margin-mobile pb-safe">
<a class="flex flex-col items-center justify-center text-gray-500 pt-2 hover:text-black transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">grid_view</span>
<span class="font-label-caps text-label-caps">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-black font-bold border-t-2 border-black pt-2 transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-caps text-label-caps">Stats</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 pt-2 hover:text-black transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</div>
</nav>
</body></html>
