<!DOCTYPE html>

<html class="dark" lang="en"><head>

                      "secondary": "#c6c6c6",

                      "secondary-container": "#474747",
                      "tertiary": "#fdffff",

                      "primary-container": "#fce300",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "margin-desktop": "40px",
                      "container-max": "1200px",
                      "margin-mobile": "20px",
                      "gutter": "16px"

              "fontFamily": {
                      "headline-lg": [

                      "title-md": [

<body class="bg-background text-on-background min-h-screen font-body-lg antialiased overflow-hidden">
<!-- Transactional Intent: Suppressing TopNavBar and SideNavBar shell as per rules for linear/transactional tasks. -->
<main class="w-full h-screen flex items-center justify-center relative p-margin-mobile md:p-margin-desktop">
<!-- Subtle background glow -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-fixed/5 rounded-full blur-[100px]"></div>
</div>
<div class="w-full max-w-2xl bg-surface-container-low border border-surface-variant rounded-xl p-8 relative z-10 shadow-2xl">
<!-- Header & Close -->
<div class="flex justify-between items-center mb-12">
<h1 class="font-headline-lg text-headline-lg text-primary-fixed">Add Expense</h1>
<button aria-label="Close" class="w-12 h-12 rounded-full border border-surface-variant flex items-center justify-center hover:border-primary-fixed hover:text-primary-fixed transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Amount Input -->
<div class="mb-12">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">AMOUNT</label>
<div class="flex items-end border-b-2 border-surface-variant focus-within:border-primary-fixed transition-colors duration-200 pb-2">
<span class="font-title-md text-title-md text-on-surface-variant mr-2 mb-2">GNF</span>
<input class="w-full bg-transparent border-none outline-none font-display-lg text-display-lg text-on-background p-0 placeholder-surface-variant focus:ring-0" style="caret-color: #fde403;" type="text" value="0"/>
</div>
</div>
<!-- Categories -->
<div class="mb-12">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-4">CATEGORY</label>
<div class="grid grid-cols-4 gap-4">
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-primary-fixed bg-surface-container-high text-primary-fixed transition-all duration-200">
<span class="material-symbols-outlined mb-2 text-3xl" data-icon="restaurant" data-weight="fill" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-body-sm text-body-sm">Food</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface hover:bg-surface-container-high hover:border-primary-fixed/50 transition-all duration-200 text-on-surface-variant">
<span class="material-symbols-outlined mb-2 text-3xl" data-icon="directions_car">directions_car</span>
<span class="font-body-sm text-body-sm">Transport</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface hover:bg-surface-container-high hover:border-primary-fixed/50 transition-all duration-200 text-on-surface-variant">
<span class="material-symbols-outlined mb-2 text-3xl" data-icon="home">home</span>
<span class="font-body-sm text-body-sm">Housing</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface hover:bg-surface-container-high hover:border-primary-fixed/50 transition-all duration-200 text-on-surface-variant">
<span class="material-symbols-outlined mb-2 text-3xl" data-icon="sports_esports">sports_esports</span>
<span class="font-body-sm text-body-sm">Leisure</span>
</button>
</div>
</div>
<!-- Note (Optional) -->
<div class="mb-12">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2">NOTE (OPTIONAL)</label>
<input class="w-full bg-surface-container rounded-lg border border-surface-variant px-4 py-3 font-body-lg text-body-lg text-on-background placeholder-surface-variant focus:outline-none focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed transition-colors" placeholder="What was this for?" type="text"/>
</div>
<!-- Action -->
<button class="w-full h-14 bg-primary-fixed text-on-primary-fixed font-title-md text-title-md rounded-lg flex items-center justify-center hover:bg-primary-fixed-dim transition-colors duration-200">
<span class="material-symbols-outlined mr-2" data-icon="check">check</span>
                Confirm Transaction
            </button>
</div>
</main>
</body></html>
