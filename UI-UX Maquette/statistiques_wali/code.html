<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wali - Statistics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#201c00",
                        "on-primary-container": "#706400",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-error": "#690005",
                        "surface": "#121414",
                        "on-primary-fixed-variant": "#504700",
                        "on-secondary-container": "#b5b5b5",
                        "error": "#ffb4ab",
                        "surface-container-low": "#1a1c1c",
                        "secondary-fixed-dim": "#c6c6c6",
                        "surface-container-high": "#282a2b",
                        "on-surface": "#e2e2e2",
                        "surface-variant": "#333535",
                        "on-primary": "#373100",
                        "on-secondary-fixed-variant": "#474747",
                        "inverse-on-surface": "#2f3131",
                        "on-background": "#e2e2e2",
                        "primary-fixed": "#fde403",
                        "surface-bright": "#37393a",
                        "secondary-fixed": "#e2e2e2",
                        "background": "#121414",
                        "tertiary-container": "#e4e1e0",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-tertiary": "#313030",
                        "on-secondary-fixed": "#1b1b1b",
                        "outline-variant": "#4b4732",
                        "primary-container": "#fce300",
                        "primary": "#fffeff",
                        "surface-tint": "#dec800",
                        "secondary-container": "#474747",
                        "on-tertiary-fixed-variant": "#474746",
                        "primary-fixed-dim": "#dec800",
                        "surface-container-highest": "#333535",
                        "on-secondary": "#303030",
                        "tertiary": "#fdffff",
                        "on-surface-variant": "#cdc7ab",
                        "error-container": "#93000a",
                        "inverse-primary": "#6a5f00",
                        "surface-container": "#1e2020",
                        "inverse-surface": "#e2e2e2",
                        "tertiary-fixed": "#e5e2e1",
                        "on-error-container": "#ffdad6",
                        "outline": "#979177",
                        "secondary": "#c6c6c6",
                        "on-tertiary-container": "#656463",
                        "surface-container-lowest": "#0c0f0f",
                        "surface-dim": "#121414"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"],
                        "title-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* Custom minimal pie chart using conic-gradient */
        .chart-container {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: conic-gradient(
                theme('colors.primary-fixed') 0% 45%, 
                theme('colors.surface-variant') 45% 75%, 
                theme('colors.outline-variant') 75% 100%
            );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chart-inner {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background-color: theme('colors.surface-container-low');
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-surface-container-lowest">
<div class="flex justify-between items-center px-margin-mobile py-4 bg-background dark:bg-surface-dim">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity duration-200 p-2 -ml-2 rounded-full active:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_balance_wallet</span>
</button>
<h1 class="font-display-lg text-display-lg font-extrabold text-primary-fixed dark:text-primary-fixed-dim tracking-tighter">Wali</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity duration-200 p-2 -mr-2 rounded-full active:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-6 pb-24 flex flex-col gap-8 max-w-container-max mx-auto w-full md:px-margin-desktop">
<!-- Header & Period Selector -->
<section class="flex flex-col gap-6">
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface md:font-headline-lg md:text-headline-lg">Statistics</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Analyze your spending</p>
</div>
<div class="flex bg-surface-container p-1 rounded-xl">
<button class="flex-1 py-2 px-4 rounded-lg font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Week</button>
<button class="flex-1 py-2 px-4 rounded-lg bg-surface-variant text-on-surface font-label-caps text-label-caps border border-outline-variant shadow-sm transition-colors">Month</button>
<button class="flex-1 py-2 px-4 rounded-lg font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors">Year</button>
</div>
</section>
<!-- Chart Section -->
<section class="flex flex-col items-center justify-center bg-surface-container-low rounded-[24px] p-8 border border-surface-container-highest">
<div class="chart-container mb-8">
<div class="chart-inner">
<span class="font-body-sm text-body-sm text-on-surface-variant">Total Spent</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-1">4,250K</span>
<span class="font-label-caps text-label-caps text-primary-fixed mt-1">GNF</span>
</div>
</div>
<!-- Legend -->
<div class="flex flex-wrap justify-center gap-4 w-full max-w-sm">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-primary-fixed"></div>
<span class="font-body-sm text-body-sm text-on-surface">Housing</span>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-auto">45%</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-surface-variant border border-outline-variant"></div>
<span class="font-body-sm text-body-sm text-on-surface">Food</span>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-auto">30%</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-outline-variant"></div>
<span class="font-body-sm text-body-sm text-on-surface">Entertainment</span>
<span class="font-label-caps text-label-caps text-on-surface-variant ml-auto">25%</span>
</div>
</div>
</section>
<!-- Top 3 Dépenses -->
<section class="flex flex-col gap-4">
<h3 class="font-title-md text-title-md text-on-surface">Top 3 Dépenses</h3>
<div class="flex flex-col gap-3">
<!-- Item 1 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined">home</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">Loyer</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Housing</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-on-surface font-semibold">1,900K</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">GNF</p>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined">restaurant</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">Supermarché</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Food</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-on-surface font-semibold">850K</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">GNF</p>
</div>
</div>
<!-- Item 3 -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-surface-container-highest">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined">directions_car</span>
</div>
<div>
<p class="font-body-lg text-body-lg text-on-surface font-semibold">Carburant</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Transport</p>
</div>
</div>
<div class="text-right">
<p class="font-body-lg text-body-lg text-on-surface font-semibold">420K</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">GNF</p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 md:hidden bg-surface/90 dark:bg-surface-container-low/90 backdrop-blur-md">
<div class="flex justify-around items-center h-16 px-margin-mobile pb-safe">
<a class="flex flex-col items-center justify-center text-on-surface-variant pt-2 hover:text-primary-fixed transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">grid_view</span>
<span class="font-label-caps text-label-caps">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-primary-fixed font-bold border-t-2 border-primary-fixed pt-2 hover:text-primary-fixed transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">insights</span>
<span class="font-label-caps text-label-caps">Stats</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant pt-2 hover:text-primary-fixed transition-colors scale-95 active:scale-90 w-1/3" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</div>
</nav>
</body></html>
