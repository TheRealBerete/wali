<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wali - Connexion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#504700",
                        "secondary": "#c6c6c6",
                        "outline-variant": "#4b4732",
                        "surface-dim": "#121414",
                        "primary": "#fffeff",
                        "background": "#121414",
                        "surface-container-lowest": "#0c0f0f",
                        "on-secondary-fixed": "#1b1b1b",
                        "error": "#ffb4ab",
                        "on-secondary-fixed-variant": "#474747",
                        "tertiary-fixed": "#e5e2e1",
                        "on-error": "#690005",
                        "on-secondary": "#303030",
                        "inverse-surface": "#e2e2e2",
                        "secondary-container": "#474747",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-surface-variant": "#cdc7ab",
                        "surface-tint": "#dec800",
                        "tertiary": "#fdffff",
                        "surface-variant": "#333535",
                        "surface-bright": "#37393a",
                        "primary-container": "#fce300",
                        "surface-container-low": "#1a1c1c",
                        "on-primary": "#373100",
                        "surface-container": "#1e2020",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-secondary-container": "#b5b5b5",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#e4e1e0",
                        "on-background": "#e2e2e2",
                        "secondary-fixed": "#e2e2e2",
                        "primary-fixed": "#fde403",
                        "inverse-primary": "#6a5f00",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "error-container": "#93000a",
                        "on-primary-container": "#706400",
                        "on-tertiary": "#313030",
                        "on-surface": "#e2e2e2",
                        "inverse-on-surface": "#2f3131",
                        "surface": "#121414",
                        "surface-container-highest": "#333535",
                        "outline": "#979177",
                        "surface-container-high": "#282a2b",
                        "on-primary-fixed": "#201c00",
                        "on-tertiary-container": "#656463",
                        "primary-fixed-dim": "#dec800"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "container-max": "1200px",
                        "unit": "4px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "title-md": ["Plus Jakarta Sans"],
                        "body-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #000000;
            color: #e2e2e2;
        }
        
        .glow-effect:focus-within {
            box-shadow: 0 0 15px rgba(253, 228, 3, 0.15);
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1A1A1A inset !important;
            -webkit-text-fill-color: #e2e2e2 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop font-body-lg text-body-lg antialiased selection:bg-primary-fixed selection:text-black relative overflow-hidden">
<!-- Subtle Ambient Glow Background Effect -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed rounded-full blur-[120px] mix-blend-screen opacity-10"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed rounded-full blur-[100px] mix-blend-screen opacity-5"></div>
</div>
<!-- Login Container -->
<div class="w-full max-w-md relative z-10">
<!-- Brand Header -->
<div class="text-center mb-12">
<h1 class="font-display-lg text-display-lg text-primary-fixed mb-2">Wali</h1>
<p class="font-body-lg text-body-lg text-secondary opacity-70">Financial Control</p>
</div>
<!-- Login Form Card -->
<form action="#" class="bg-[#1A1A1A] border border-[#2C2C2C] rounded-xl p-8 flex flex-col gap-6" method="POST">
<div class="text-center mb-2">
<h2 class="font-title-md text-title-md text-on-surface">Welcome back</h2>
<p class="font-body-sm text-body-sm text-secondary mt-1">Enter your details to proceed.</p>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider" for="email">Email Address</label>
<div class="relative flex items-center bg-[#1A1A1A] border-b border-[#2C2C2C] pb-2 transition-all duration-300 focus-within:border-primary-fixed glow-effect group">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary-fixed transition-colors absolute left-0" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none text-on-surface focus:ring-0 focus:outline-none pl-8 py-2 placeholder:text-surface-variant font-body-lg" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2 mt-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-primary-fixed transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center bg-[#1A1A1A] border-b border-[#2C2C2C] pb-2 transition-all duration-300 focus-within:border-primary-fixed glow-effect group">
<span class="material-symbols-outlined text-secondary group-focus-within:text-primary-fixed transition-colors absolute left-0" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none text-on-surface focus:ring-0 focus:outline-none pl-8 pr-10 py-2 placeholder:text-surface-variant font-body-lg" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-6 w-full h-[56px] bg-primary-fixed hover:bg-surface-tint text-black font-title-md text-title-md rounded-lg flex items-center justify-center transition-all duration-300 transform active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2 focus:ring-offset-black relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center gap-2">
                    Sign In
                    <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</span>
<!-- Button Hover Effect -->
<div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-secondary">
                Don't have an account? 
                <a class="text-primary-fixed hover:underline font-title-md text-body-sm" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
